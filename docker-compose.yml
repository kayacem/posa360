version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: posa360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: posa360
      POSTGRES_PASSWORD: posa360secure
      POSTGRES_DB: posa360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posa360"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
