# POSA E-ticaret hub HTTPS — install only AFTER the cert exists:
#   certbot certonly --nginx -d eticaret.posa360.com -d panel.posa360.com
# Uses upstream posa_eticaret defined in posa-eticaret.conf.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eticaret.posa360.com panel.posa360.com;

    ssl_certificate     /etc/letsencrypt/live/eticaret.posa360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eticaret.posa360.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://posa_eticaret;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
