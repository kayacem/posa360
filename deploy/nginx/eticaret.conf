# POSA E-ticaret — HTTP-01 per-host certs (no wildcard, no DO DNS plugin)
#
# Install (two phases, see docs/DEPLOY.md):
#   1) this file  -> /etc/nginx/sites-available/posa-eticaret.conf (+ symlink in sites-enabled)
#      nginx -t && reload; certbot certonly --nginx -d eticaret.posa360.com -d panel.posa360.com
#   2) eticaret-ssl.conf -> /etc/nginx/sites-available/posa-eticaret-ssl.conf (+ symlink)
#      nginx -t && reload
#
# NOTE: no `http2` on listen lines — on nginx 1.24 that flag is per address:port and
# would silently switch every other site on :443 to HTTP/2.
#
# Exact server_name for randevu/yonet/ajans/otel/menu (and apex/www) elsewhere
# ALWAYS win over the catch-all below — do not remove those blocks.
#
# Store subdomains: HTTP-only via catch-all until issue-domain-cert.sh writes a
# per-host include under /etc/nginx/sites-available/posa-eticaret-hosts/.

upstream posa_eticaret {
    server 127.0.0.1:3030;
    keepalive 8;
}

# Per-host HTTPS (and optional HTTP→HTTPS) vhosts written by cert cron
include /etc/nginx/sites-available/posa-eticaret-hosts/*.conf;

# --- Hub: eticaret.posa360.com (+ optional panel) ---
server {
    listen 80;
    listen [::]:80;
    server_name eticaret.posa360.com panel.posa360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Hub cert is issued at install time (see eticaret-ssl.conf)
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Catch-all store subdomains: HTTP only (no forced HTTPS until per-host cert) ---
server {
    listen 80;
    listen [::]:80;
    server_name *.posa360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 32m;

    location / {
        proxy_pass http://posa_eticaret;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
