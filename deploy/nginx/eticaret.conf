# POSA E-ticaret — HTTP-01 per-host certs (no wildcard, no DO DNS plugin)
#
# Install:
#   sudo cp deploy/nginx/eticaret.conf /etc/nginx/sites-available/posa-eticaret.conf
#   sudo ln -sf /etc/nginx/sites-available/posa-eticaret.conf /etc/nginx/sites-enabled/
#   # Issue hub cert (see docs/DEPLOY.md), then enable the 443 server block paths
#   sudo nginx -t && sudo systemctl reload nginx
#
# Exact server_name for randevu/yonet/ajans/otel/menu (and apex/www) elsewhere
# ALWAYS win over the catch-all below — do not remove those blocks.
#
# Store subdomains: HTTP-only via catch-all until issue-domain-cert.sh writes a
# per-host include under /etc/nginx/sites-available/posa-eticaret-hosts/.

upstream posa_eticaret {
    server 127.0.0.1:3030;
    keepalive 8;
}

# Per-host HTTPS (and optional HTTP→HTTPS) vhosts written by cert cron
include /etc/nginx/sites-available/posa-eticaret-hosts/*.conf;

# --- Hub: eticaret.posa360.com (+ optional panel) ---
server {
    listen 80;
    listen [::]:80;
    server_name eticaret.posa360.com panel.posa360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # After hub cert exists, certbot --nginx may add redirect; or enable manually:
    # return 301 https://$host$request_uri;
    location / {
        proxy_pass http://posa_eticaret;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# Hub HTTPS — enable after: certbot --nginx -d eticaret.posa360.com [-d panel.posa360.com]
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eticaret.posa360.com panel.posa360.com;

    ssl_certificate     /etc/letsencrypt/live/eticaret.posa360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eticaret.posa360.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://posa_eticaret;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# --- Catch-all store subdomains: HTTP only (no forced HTTPS until per-host cert) ---
server {
    listen 80;
    listen [::]:80;
    server_name *.posa360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 32m;

    location / {
        proxy_pass http://posa_eticaret;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
