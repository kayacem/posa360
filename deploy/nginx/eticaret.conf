# POSA E-ticaret — eticaret.posa360.com + store wildcard *.posa360.com → 127.0.0.1:3030
#
# Install:
#   sudo cp deploy/nginx/eticaret.conf /etc/nginx/sites-available/posa-eticaret.conf
#   sudo ln -sf /etc/nginx/sites-available/posa-eticaret.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Exact server_name blocks for randevu/yonet/ajans/otel/menu (and apex/www) that already
# exist elsewhere ALWAYS win over the wildcard below — do not remove those blocks.
#
# TLS: issue via certbot dns-digitalocean (see docs/DEPLOY.md). Adjust live/ paths
# if certbot names the lineage differently.

upstream posa_eticaret {
    server 127.0.0.1:3030;
    keepalive 8;
}

# --- Hub: marketing + kayit + login + super-admin (/admin → app rewrite) ---
server {
    listen 80;
    listen [::]:80;
    server_name eticaret.posa360.com panel.posa360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eticaret.posa360.com panel.posa360.com;

    # Prefer dedicated eticaret cert; or reuse wildcard if SANs cover eticaret
    ssl_certificate     /etc/letsencrypt/live/eticaret.posa360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eticaret.posa360.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://posa_eticaret;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# --- Store subdomains: {slug}.posa360.com (exact product blocks take precedence) ---
server {
    listen 80;
    listen [::]:80;
    server_name *.posa360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.posa360.com;

    # Wildcard cert from certbot dns-digitalocean (*.posa360.com)
    ssl_certificate     /etc/letsencrypt/live/posa360.com-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posa360.com-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://posa_eticaret;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
