services:
  postgres:
    image: postgres:16-alpine
    container_name: posa360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-posa360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-posa360}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Not exposed to host — only reachable on the internal Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posa360} -d ${POSTGRES_DB:-posa360}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - posa360

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posa360-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-posa360}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-posa360}?schema=public
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - posa360

  caddy:
    build:
      context: ./deploy/caddy
      dockerfile: Dockerfile
    container_name: posa360-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TLS_MODE: ${TLS_MODE:-ondemand}
      ACME_EMAIL: ${ACME_EMAIL:-admin@posa360.com}
      PLATFORM_DOMAIN: ${NEXT_PUBLIC_PLATFORM_DOMAIN:-posa360.com}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - posa360

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  posa360:
    driver: bridge
